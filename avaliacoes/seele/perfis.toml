# autorização, a projeção de privacidade, os limites de crescimento e a
# travessia de caminho continuam sendo o código avaliado em 17/09. É o fato que
# mais encurta esta leitura, e por isso está primeiro.
#
# **A metade de janela cresceu 1.065 linhas, e nenhuma delas alcança mais.**
# A contagem de linhas *acrescentadas* em `cliente/` e `servidor/` casando com
# `fetch(`, `XMLHttpRequest`, `WebSocket`, `eval(`, `new Function`, `import(`,
# `require(`, `innerHTML`, `outerHTML`, `insertAdjacentHTML` ou `document.` é
# **zero**. Não é acaso: na API 4 o cliente deixou de escrever no documento e
# passou a declarar o que quer, e quem desenha é o renderer do produto. O
# caminho que a avaliação da 2.0.0 chamou de «o que mais custou a fechar» — os
# três `innerHTML` — deixou de existir no pacote.
#
# Os achados de `fetch`, `child_process` e `playwright` que uma varredura larga
# encontra estão todos em `ferramentas/`, que é o laboratório: ele viaja no
# pacote, mas `mod.json` aponta `client` e `server`, e nada mais é executado.
