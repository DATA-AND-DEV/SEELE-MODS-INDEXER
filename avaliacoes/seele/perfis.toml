# sendo defeito de segurança e continua sendo peso que quem instala paga sem
# receber nada; a terceira anotação seguida sugere que a resposta certa é
# publicar o pacote sem `ferramentas/` e `test/`, e não anotar de novo.
#
# **O teto de sempre: isto é um filtro, não uma prova.** E vale a mesma
# observação de método da 2.0.0: quem leu escreveu parte do código desta
