<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050403">
<title>SEELE MODS: o catálogo de mods da comunidade</title>
<meta name="description"
      content="O índice de mods do SEELE: temas, painéis, sons e integrações que passaram pela avaliação, num catálogo assinado e instalável direto do app.">
<!-- Nenhum script externo, nenhuma folha externa, nenhum pixel. A CSP diz
     em voz alta o que o resto do produto já garantia por construção. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<!-- Os mesmos três ícones de seele.app.br, na mesma ordem: o Safari não
     desenha favicon em SVG, então o .ico vem primeiro e é ele que o WebKit
     usa; quem entende SVG pega o vetor logo abaixo. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fontes.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="casca.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="pagina">
  <!-- O cabeçalho e o rodapé são os de seele.app.br (casca.css). -->
  <header class="cabecalho" id="topo">
    <a class="cabecalho__marca" href="#/">
      <svg viewBox="0 0 96 96" width="26" height="26" role="img" aria-label="SEELE">
        <title>SEELE</title>
        <path d="M34 34L62 62" stroke="#EAE3CF" stroke-width="6"></path>
        <rect x="12" y="12" width="24" height="24" fill="#F2521F"></rect>
        <rect x="62" y="62" width="20" height="20" fill="none" stroke="#F2521F" stroke-width="6"></rect>
      </svg>
      <span><span class="cabecalho__nome">SEELE</span> <span class="cabecalho__sub">MODS</span></span>
    </a>

    <label class="cabecalho__busca">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#908574" stroke-width="1.3" aria-hidden="true">
        <circle cx="7" cy="7" r="3.6"></circle><path d="M9.7 9.7L13 13"></path>
      </svg>
      <input id="busca" type="search" placeholder="buscar mods, autores, repositórios"
             spellcheck="false" autocomplete="off" aria-label="Buscar no catálogo">
    </label>

    <nav class="cabecalho__nav" aria-label="Seções">
      <a class="cabecalho__link" href="guia/">CRIAR UM MOD</a>
      <a class="cabecalho__link" href="#/" data-ir="catalogo">CATÁLOGO</a>
      <a class="cabecalho__link" href="#/revogacoes" data-ir="revogacoes">REVOGAÇÕES</a>
      <a class="cabecalho__link" href="#/publicar" data-ir="publicar">PUBLICAR</a>
    </nav>

    <!-- O mesmo BAIXAR do site, e para o mesmo lugar: um MOD se instala pelo
         app, e quem chega aqui sem ele precisa de um caminho até ele. -->
    <a class="cabecalho__acao" href="https://seele.app.br/#baixar">BAIXAR</a>
  </header>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <main class="corpo" id="corpo"></main>

  <footer class="rodape">
    <span class="rodape__marca">
      <svg viewBox="0 0 96 96" width="22" height="22" role="img" aria-label="SEELE">
        <title>SEELE</title>
        <path d="M34 34L62 62" stroke="#EAE3CF" stroke-width="6"></path>
        <rect x="12" y="12" width="24" height="24" fill="#F2521F"></rect>
        <rect x="62" y="62" width="20" height="20" fill="none" stroke="#F2521F" stroke-width="6"></rect>
      </svg>
      <span><span class="rodape__nome">SEELE</span> <span class="rodape__sub">MODS</span></span>
    </span>
    <span class="rodape__dominio">mods.seele.app.br</span>
    <span class="rodape__espaco"></span>
    <nav class="rodape__atalhos" aria-label="Atalhos do rodapé">
      <a class="rodape__link" href="https://seele.app.br">SEELE.APP.BR</a>
      <a class="rodape__link" href="chave.pub">CHAVE PÚBLICA</a>
      <a class="rodape__link" href="catalogo.json">CATALOGO.JSON</a>
      <a class="rodape__link" href="revogacoes.json">REVOGACOES.JSON</a>
    </nav>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
